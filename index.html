<title>请输入访问口令</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0c10'/%3E%3Crect x='18' y='18' width='9' height='9' rx='2' fill='%232f45ff'/%3E%3C/svg%3E">
<style>
:root{--ink:#0b0c10;--body:#363a44;--muted:#666b77;--faint:#8b909c;--line:#e5e7ec;--line-2:#d6d9e0;--soft:#f6f7f9;--acc:#2f45ff;--acc-ink:#1c2bc8;--err:#b42318;
--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--soft);color:var(--body);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 32px 32px;box-shadow:0 1px 2px rgba(11,12,16,.04),0 12px 32px -12px rgba(11,12,16,.10)}
.mark{width:36px;height:36px;border-radius:10px;background:var(--ink);position:relative;margin-bottom:22px}
.mark::after{content:"";position:absolute;right:7px;bottom:7px;width:11px;height:11px;border-radius:3px;background:var(--acc)}
h1{margin:0 0 6px;color:var(--ink);font-size:20px;font-weight:700;line-height:1.35}
p{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.6}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
input{width:100%;height:46px;border:1px solid var(--line-2);border-radius:10px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,69,255,.14)}
input[aria-invalid=true]{border-color:var(--err)}
button{margin-top:14px;width:100%;height:46px;border:0;border-radius:10px;background:var(--ink);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
button:hover{background:#1d2030}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--err)}
.msg.info{color:var(--faint)}
noscript{display:block;margin-top:12px;font-size:13px;color:var(--err)}
</style>
</head>
<body>
<main class="card">
<div class="mark" aria-hidden="true"></div>
<h1>请输入访问口令</h1>
<p>此页面仅限受邀人查看。</p>
<form id="f" autocomplete="off">
<label for="pw">访问口令</label>
<input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
<button id="b" type="submit">进入</button>
<div id="m" class="msg" role="status" aria-live="polite"></div>
</form>
<noscript>请启用 JavaScript 后访问。</noscript>
</main>

<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  var f=document.getElementById('f'),pw=document.getElementById('pw'),b=document.getElementById('b'),m=document.getElementById('m');
  function u8(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
  if(!(window.crypto&&crypto.subtle)){m.textContent='当前浏览器不支持解密，请更换浏览器（需 HTTPS）。';b.disabled=true;return;}
  f.addEventListener('submit',async function(e){
    e.preventDefault();
    if(!pw.value)return;
    b.disabled=true;m.className='msg info';m.textContent='正在验证…';pw.removeAttribute('aria-invalid');
    try{
      var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c));
      var html=new TextDecoder().decode(pt);
      pw.value='';
      document.open();document.write(html);document.close();
      if(location.hash){var h=location.hash;setTimeout(function(){var t=document.getElementById(decodeURIComponent(h.slice(1)));if(t)t.scrollIntoView();},50);}
    }catch(err){
      b.disabled=false;m.className='msg';m.textContent='口令不正确，请重试。';pw.setAttribute('aria-invalid','true');pw.select();
    }
  });
})();
</script>
